{% extends "accounts_base.html" %}

{% block title %}
    Register - PI Helper
{% endblock %}

{% block account_content %}

    <h1>Register</h1>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Register</button>
    </form>

    <p>
        Already have an account?
        <a href="{% url 'login' %}">Login</a>
    </p>

{% endblock %}
